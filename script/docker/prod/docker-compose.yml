services:
  mysql:
    image: mysql:8.4.9
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: ${HERON_PASSWORD:?请通过环境变量或 --env-file 指定 HERON_PASSWORD}
      # 初始化数据库(后续的初始化sql会在这个库执行)
      MYSQL_DATABASE: heron
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - /docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    network_mode: "host"

  nginx-web:
    image: nginx:1.31.1
    container_name: nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 证书映射
      - /docker/nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - /docker/nginx/html:/usr/share/nginx/html
      # 日志目录
      - /docker/nginx/log:/var/log/nginx
    privileged: true
    network_mode: "host"

  redis:
    image: redis:8.6.3
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/redis/conf:/redis/config:rw
      # 数据文件
      - /docker/redis/data/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    network_mode: "host"

  minio:
    # pgsty 开源社区 fork 重新维护的最新版 minio
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名，必填：仓库不留固定账号
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请通过环境变量或 --env-file 指定 MINIO_ROOT_USER}
      # 管理后台密码，必填：最小8个字符
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请通过环境变量或 --env-file 指定 MINIO_ROOT_PASSWORD}
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - /docker/minio/data:/data
      # 映射配置目录
      - /docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    network_mode: "host"

  heron-server1:
    image: heron:prod
    container_name: heron-server1
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      HERON_PASSWORD: ${HERON_PASSWORD:?请通过环境变量或 --env-file 指定 HERON_PASSWORD}
      SERVER_PORT: 8085
      SNAIL_JOB_PORT: 28080
      SNAIL_AI_PORT: 38080
      # 显式钉住生产 profile，避免用了 dev 构建出来的镜像
      SPRING_PROFILES_ACTIVE: prod
      # dev 占 Redis db 0，生产用 db 1，避免缓存 key 指向不同库却互相命中
      SPRING_DATA_REDIS_DATABASE: 1
      # JWT 签名密钥，必填：泄露了就能伪造任意用户的登录令牌。
      # 多实例必须用同一个值，否则跨实例的令牌互相不认。
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:?请通过环境变量或 --env-file 指定 SA_TOKEN_JWT_SECRET}
    volumes:
      # 配置文件
      - /docker/server1/logs/:/heron/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/heron/skywalking/agent
    privileged: true
    network_mode: "host"

  heron-server2:
    image: heron-server:6.1.0
    container_name: heron-server2
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      HERON_PASSWORD: ${HERON_PASSWORD:?请通过环境变量或 --env-file 指定 HERON_PASSWORD}
      SERVER_PORT: 8086
      SNAIL_JOB_PORT: 28081
      SNAIL_AI_PORT: 38081
      # 与 server1 同一个密钥，否则跨实例的令牌互相不认
      SA_TOKEN_JWT_SECRET: ${SA_TOKEN_JWT_SECRET:?请通过环境变量或 --env-file 指定 SA_TOKEN_JWT_SECRET}
      # 显式钉住生产 profile：不钉的话 server2 会读 application-dev.yml 的开发兜底密钥，
      # 那份值写在仓库里，等于对外环境用着公开的签名密钥。
      SPRING_PROFILES_ACTIVE: prod
      # 与 server1 同一个 Redis 库，否则两个实例各写各的缓存
      SPRING_DATA_REDIS_DATABASE: 1
    volumes:
      # 配置文件
      - /docker/server2/logs/:/heron/server/logs/
      # skywalking 探针
#      - /docker/skywalking/agent/:/heron/skywalking/agent
    privileged: true
    network_mode: "host"

  ruoyi-monitor-admin:
    image: ruoyi/ruoyi-monitor-admin:6.1.0
    container_name: ruoyi-monitor-admin
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - /docker/monitor/logs/:/ruoyi/monitor/logs
    privileged: true
    network_mode: "host"

  ruoyi-snailjob-server:
    image: ruoyi/ruoyi-snailjob-server:6.1.0
    container_name: ruoyi-snailjob-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      HERON_PASSWORD: ${HERON_PASSWORD:?请通过环境变量或 --env-file 指定 HERON_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${HERON_PASSWORD:?请通过环境变量或 --env-file 指定 HERON_PASSWORD}
    ports:
      - "8800:8800"
      - "17888:17888"
    volumes:
      - /docker/snailjob/logs/:/ruoyi/snailjob/logs
    privileged: true
    network_mode: "host"

  ruoyi-snailai-server:
    image: ruoyi/ruoyi-snailai-server:6.1.0
    container_name: ruoyi-snailai-server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      HERON_PASSWORD: ${HERON_PASSWORD:?请通过环境变量或 --env-file 指定 HERON_PASSWORD}
      SPRING_DATASOURCE_PASSWORD: ${HERON_PASSWORD:?请通过环境变量或 --env-file 指定 HERON_PASSWORD}
      # Docling 与 PaddleOCR 服务需单独部署；host 网络模式下默认通过宿主机端口访问
      SNAIL_AI_RAG_DOCLING_ENABLED: ${SNAIL_AI_RAG_DOCLING_ENABLED:-true}
      SNAIL_AI_RAG_DOCLING_URL: ${SNAIL_AI_RAG_DOCLING_URL:-http://127.0.0.1:5100}
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED: ${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_ENABLED:-true}
      SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL: ${SNAIL_AI_RAG_DOCLING_PADDLE_OCR_URL:-http://127.0.0.1:8866/ocr}
    ports:
      - "8900:8900"
      - "18888:18888"
    volumes:
      - /docker/snailai/logs/:/ruoyi/snailai/logs
    privileged: true
    network_mode: "host"
