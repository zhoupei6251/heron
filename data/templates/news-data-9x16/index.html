    <style>
/* 所有模板共享的画布基础。令牌由 _shared/tokens 下的同名样式文件提供。
   注意：注释里不要出现 style 标签的字面写法，它会被 HTML 解析器当成真的开始标签。 */
@font-face {
  font-family: "Noto Sans SC";
  src: url("fonts/NotoSansSC-Regular.otf") format("truetype");
  font-weight: 100 900;
  font-display: block;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
}
#root {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
}
.clip { position: absolute; inset: 0; }

/* 纵深：环境层是最远的一层，永远在内容之下、永远在动。
   三层各自可开关（透明度为 0 即视为关闭），但网格与光晕是默认配置。 */
.ambient { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.ambient > div { position: absolute; inset: 0; }
.ambient-grid {
  background-image:
    linear-gradient(to right, var(--rule-faint) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule-faint) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
  opacity: var(--grid-opacity);
}
.ambient-glow {
  background: radial-gradient(circle at var(--glow-x) var(--glow-y),
              var(--glow-color) 0%, transparent var(--glow-spread));
  opacity: var(--glow-opacity);
}
.ambient-grain {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.55'/></svg>");
  background-size: 140px 140px;
  opacity: var(--grain-opacity);
}
/* 内容层压在环境层之上：骨架里的每块都自己定位，这里只统一抬 z-index。 */
#title-card, #chart-slot, .scene, #closing-slot, #bottom-bar { z-index: 1; }

/* 场景序号：给画面一个「第几拍」的锚点，避免每屏长得一样。 */
.scene-no {
  display: block;
  font-family: var(--font-num);
  font-size: var(--fs-note);
  font-weight: 700;
  letter-spacing: var(--track-kicker);
  font-variant-numeric: tabular-nums;
}

/* 硬规则 1：视频字号下限 24px，竖屏 32px。这条不能靠 CSS 强制，只作为约定写在这里，由构建期校验兜底。 */
/* 风格 C · Dynamic Data Explainer：深底、高对比、等宽数字、网格装饰。
   定位：数据看板解读、指标变化、排行与趋势。信息密度最高的一套。
   注意：--accent 不在这里定义——它由 HyperFrames 从 composition 的
   color 类型变量自动注入为同名 CSS 自定义属性，手写会与之冲突。 */
:root {
  --bg: #0c1417;
  --fg: #f3f0e8;
  --muted: #7f949b;
  --muted-2: #9fb0b6;
  --body: #b7c4c9;
  --legend: #dde6e8;
  --down: #e06c5a;

  --rule-faint: rgba(243, 240, 232, 0.12);
  --rule-soft: rgba(243, 240, 232, 0.14);
  --rule-strong: rgba(243, 240, 232, 0.28);
  --panel: rgba(243, 240, 232, 0.06);
  --glow-color: rgba(24, 183, 201, 0.20);
  --accent-glow: rgba(24, 183, 201, 0.35);

  --font-body: "Noto Sans SC", sans-serif;
  --font-num: "Noto Sans SC", sans-serif;

  --fs-title: 92px;
  --fs-title-lg: 76px;
  --fs-title-sm: 68px;
  --fs-data: 64px;
  --fs-data-sm: 34px;
  --fs-lead: 54px;
  --fs-body: 38px;
  --fs-label: 28px;
  --fs-note: 28px;

  --pad-frame: 84px;
  --rule-width: 3px;
  --radius: 8px;
  --track-kicker: 0.16em;

  /* 环境层：网格给结构感，光晕给焦点，颗粒给质感。透明度不得低于 0.1，否则等于没有。 */
  --grid-size: 72px;
  --grid-opacity: 0.55;
  --glow-x: 78%;
  --glow-y: 18%;
  --glow-spread: 62%;
  --glow-opacity: 0.9;
  --grain-opacity: 0.16;

  --dur-entrance: 0.55s;
  --dur-swap: 0.32s;
  --dur-ambient: 7s;
  --ease-out: power3.out;
  --ease-in: power2.in;
}

#chart-slot { top: 430px; left: var(--pad-frame); right: var(--pad-frame); height: 760px; overflow: hidden; }
#chart { width: 100%; height: 100%; display: block; }
.axis { stroke: var(--rule-soft); stroke-width: 2; }

.series-line { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round;
               filter: drop-shadow(0 0 8px var(--accent-glow)); }
.series-area { fill: var(--accent); opacity: 0.16; }
.dot { fill: var(--accent); filter: drop-shadow(0 0 10px var(--accent-glow)); }
.dot-label { fill: var(--fg); font-size: var(--fs-data-sm); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { fill: var(--accent); transform-box: fill-box; transform-origin: left center; }
.bar-label { fill: var(--fg); font-size: var(--fs-label); font-weight: 600; }

.band { stroke: var(--bg); stroke-width: 2; }
.multi-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.baseline { stroke: var(--rule-strong); stroke-width: 2; stroke-dasharray: 10 10; }
.legend-name { fill: var(--legend); font-weight: 600; }
.legend-value { fill: var(--muted-2); font-variant-numeric: tabular-nums; }
.radar-grid { fill: none; stroke: var(--rule-faint); stroke-width: 2; }

.radar-poly { fill: var(--accent); fill-opacity: 0.18; stroke: var(--accent); stroke-width: 5;
              stroke-linejoin: round; filter: drop-shadow(0 0 10px var(--accent-glow)); }
.radar-dot { fill: var(--accent); }
.radar-label { fill: var(--legend); font-weight: 600; }
.radar-value { fill: var(--muted-2); font-weight: 400; font-variant-numeric: tabular-nums; }
.chart-note { fill: var(--muted); font-size: var(--fs-note); }
/* news-data-9x16 的版式差异（风格 C · 动态数据解释）。令牌见 _shared/tokens/data-board.css。
   纵向预算（1080×1920）：标题区 0–500 / 图表 520–1120 / 场景 1130–1550 / 底栏 1600–1690。
   改任何一段高度都要重算这条线，否则文字会被自己的盒子裁掉。 */
#title-card { padding: 104px var(--pad-frame) 0 var(--pad-frame); }
#kicker { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
#kicker-flag { width: 56px; height: 8px; background: var(--accent); }
#kicker-text { font-size: var(--fs-note); font-weight: 700; letter-spacing: var(--track-kicker); color: var(--muted-2); }
#title {
  margin: 0;

  line-height: 1.16;
  letter-spacing: -0.02em;

}
#rule { margin-top: 26px; width: 100%; height: var(--rule-width); background: var(--accent); transform-origin: left center; }
#chart-slot { top: 500px; height: 550px; }

.scene {
  top: 1075px;
  bottom: 410px;
  left: 0;
  right: 0;
  padding: 0 var(--pad-frame);

}
/* flex: none——默认的 flex-shrink 会在内容超高时把文字盒压扁，再由 overflow 裁掉字形 */
.scene-no { flex: none; color: var(--accent); margin-bottom: 12px; }
.lead { flex: none; margin: 0 0 18px; font-size: var(--fs-lead); font-weight: 700; line-height: 1.5; color: var(--fg);
        max-height: 164px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.body { flex: none; margin: 0; font-size: var(--fs-body); font-weight: 400; line-height: 1.7; color: var(--body);
        max-height: 198px; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.scene-figure { flex: none; margin: 0 0 20px; height: 280px; border-radius: var(--radius); overflow: hidden; }
.scene-figure img { width: 100%; height: 100%; object-fit: cover; display: block; }

#closing-slot { top: 1075px; bottom: 410px; padding: 0 var(--pad-frame); display: flex; align-items: flex-start; }
#closing { margin: 0; padding: 24px 28px; font-size: var(--fs-body); font-weight: 500; line-height: 1.7; color: var(--fg);
           background: var(--panel); border-left: 10px solid var(--accent); border-radius: var(--radius);
           display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }

#bottom-bar { position: absolute; left: 0; right: 0; bottom: 300px; padding: 0 var(--pad-frame); }
#progress { display: block; height: 6px; border-radius: 3px; background: var(--accent);
            transform-origin: left center; margin-bottom: 28px; }
#meta-row { display: flex; align-items: center; justify-content: space-between; }
#aigc-badge { font-size: var(--fs-label); padding: 12px 24px; border-radius: 999px; white-space: nowrap;
              color: var(--bg); background: var(--fg); }
#source-line { font-size: var(--fs-label); max-width: 560px; text-align: right; color: var(--muted); }

    <script src="gsap.min.js"></script>
    <script>
// 变量注入与通用填充。所有模板共用，必须最先执行。
const declared = window.__hyperframes && window.__hyperframes.getVariables
  ? window.__hyperframes.getVariables()
  : {};
const root = document.getElementById("root");
const tl = gsap.timeline({ paused: true });
const total = parseFloat(root.dataset.duration);

// 模板里的尺寸一律来自令牌，避免 JS 和 CSS 各写一份而漂移
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// 标题按字数降档：92px → 76px → 68px
const titleEl = document.getElementById("title");
const titleLen = Array.from(declared.title || titleEl.textContent || "").length;
if (titleLen > 11) titleEl.style.fontSize = cssVar("--fs-title-sm");
else if (titleLen > 9) titleEl.style.fontSize = cssVar("--fs-title-lg");

// 实际播几屏由稿件决定，模板只负责准备好槽位
const sceneCount = Number.isFinite(Number(declared.scene_count)) ? Number(declared.scene_count) : 3;

// 屏次编号与配图同理：槽位先备好，有没有编号和有没有图由稿件与模板能力决定。
document.querySelectorAll(".scene").forEach((slot) => {
  const index = slot.dataset.sceneIndex;
  const no = slot.querySelector(".scene-no");
  if (no) no.textContent = String(index).padStart(2, "0");
  // 场景类型落到属性上：quote / rank 这类版式靠 [data-scene-type] 选择器换排版，
  // 只声明变量不写属性，那些变体就是死代码。
  const type = declared["scene" + index + "_type"];
  if (type) slot.dataset.sceneType = type;
  const figure = slot.querySelector(".scene-figure");
  const src = declared["scene" + index + "_image"];
  if (!figure || !src) return;
  // has-image 让版式知道这一屏真的有图：文稿线用它把图位展开、同时把正文压回两行
  slot.classList.add("has-image");
  // img 由脚本创建而不是写在 HTML 里：静态 <img> 会被版式闸判成同组重复媒体节点
  const img = document.createElement("img");
  img.alt = "";
  img.src = src;
  figure.appendChild(img);
});

      const dataset = JSON.parse(declared.dataset_json);
      const chart = declared.chart || "line";
      if (!["line", "bars", "race", "stacked", "multiline", "radar"].includes(chart)) {
        throw new Error("尚未实现的图表模块：" + chart);
      }
      const precision = Number(dataset.metric && dataset.metric.precision);
      const unit = dataset.metric && dataset.metric.unit ? dataset.metric.unit : "";
      const rows = dataset.rows.map((row) => ({ label: String(row[0]), value: Number(row[1]) }));
      const svg = document.getElementById("chart");
      const NS = "http://www.w3.org/2000/svg";
      const make = (name, attrs) => {
        const node = document.createElementNS(NS, name);
        Object.keys(attrs).forEach((key) => node.setAttribute(key, attrs[key]));
        return node;
      };
      const fmt = (value) => Number(value).toFixed(Number.isFinite(precision) ? precision : 2);
      const facts = dataset.facts || {};
      if (facts.last && typeof facts.last.value === "number") {
        document.getElementById("kpi-value").textContent = fmt(facts.last.value);
        document.getElementById("kpi-unit").textContent = unit;
        if (typeof facts.change === "number") {
          const arrow = facts.change >= 0 ? "▲" : "▼";
          const pct = typeof facts.change_pct === "number" ? "（" + Math.abs(facts.change_pct).toFixed(2) + "%）" : "";
          const changeEl = document.getElementById("kpi-change");
          changeEl.textContent = arrow + " " + fmt(Math.abs(facts.change)) + pct;
          changeEl.style.color = facts.change >= 0 ? "var(--accent)" : "var(--down)";
        }
      } else if (facts.leader) {
        document.getElementById("kpi-value").textContent = fmt(facts.leader.value);
        document.getElementById("kpi-unit").textContent = unit;
        document.getElementById("kpi-change").textContent = facts.leader.label || facts.leader.location
          || facts.leader.name || "";
      }
      const W = 912;
      // 初始化时按实际图位确定坐标系，避免760高的图被缩进460高的版式后字也一起变小。
      const H = Math.round(W * (svg.clientHeight || 760) / (svg.clientWidth || W));
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      const pad = { left: 132, right: 36, top: 56, bottom: 72 };
      const chartEvidence = { points: new Map(), rows: new Map(), series: new Map(), race: null };
      const openingScene = document.querySelector('.scene[data-scene-index="1"]');
      const openingEnd = openingScene
        ? Number(openingScene.dataset.start) + Number(openingScene.dataset.duration) : 8;
      const introDrawStart = 0.35;
      const introDrawDuration = Math.max(0.7, Math.min(8, openingEnd - 0.8));
      const introDrawEnd = introDrawStart + introDrawDuration;
      tl.fromTo("#chart", { scale: 1 }, { scale: 1.04, duration: total, ease: "none", transformOrigin: "center center" }, 0);
      const clip = (text) => {
        const list = Array.from(text);
        const max = /[一-鿿]/.test(text) ? 10 : 22;
        return list.length > max ? list.slice(0, max).join("") + "…" : text;
      };

      // long 形态：(date, series, value)。折线/排行两种 wide 形态不走这里。
      const parseLong = () => {
        const byName = new Map();
        const dateSet = new Set();
        dataset.rows.forEach((row) => {
          const date = String(row[0]);
          const name = String(row[1]);
          const value = Number(row[2]);
          if (!Number.isFinite(value)) return;
          dateSet.add(date);
          if (!byName.has(name)) byName.set(name, new Map());
          byName.get(name).set(date, value);
        });
        return { byName, dates: Array.from(dateSet).sort() };
      };
      const lastValue = (points, dates) => {
        for (let i = dates.length - 1; i >= 0; i--) {
          if (points.has(dates[i])) return points.get(dates[i]);
        }
        return NaN;
      };
      const accentHue = () => {
        const hex = getComputedStyle(document.getElementById("root")).getPropertyValue("--accent")
          .trim().replace("#", "");
        if (!/^[0-9a-f]{6}$/i.test(hex)) return 187;
        const rgb = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
        const max = Math.max(...rgb);
        const min = Math.min(...rgb);
        const d = max - min;
        if (!d) return 187;
        const h = max === rgb[0] ? ((rgb[1] - rgb[2]) / d) % 6
          : max === rgb[1] ? (rgb[2] - rgb[0]) / d + 2
          : (rgb[0] - rgb[1]) / d + 4;
        return (h * 60 + 360) % 360;
      };
      const baseHue = accentHue();
      // 20 个系列也不彩虹：色相只在强调色两侧小幅摆动，相邻靠明度错开。
      const seriesColor = (index, count) => {
        const sweep = Math.min(76, 10 + count * 6);
        const angle = count <= 1 ? 0 : (index / (count - 1) - 0.5) * sweep;
        const lightness = [46, 58, 66][index % 3];
        return "hsl(" + ((baseHue + angle + 360) % 360).toFixed(1) + " " + (count > 12 ? 52 : 64)
          + "% " + lightness + "%)";
      };
      const charEm = (ch) => /[\x00-\xff]/.test(ch) ? 0.56 : 1;
      const clipTo = (text, px, size) => {
        const list = Array.from(text);
        let used = 0;
        let keep = 0;
        for (const ch of list) {
          if ((used + charEm(ch)) * size > px) break;
          used += charEm(ch);
          keep += 1;
        }
        if (keep >= list.length) return text;
        return list.slice(0, Math.max(1, keep - 1)).join("") + "…";
      };
      // 图例行：行高够就名字一行、数值一行，不够就单行。字号按行高反推，下限 16。
      const legendItem = (x, right, y, rowH, color, name, value) => {
        const twoLine = rowH >= 56;
        const size = Math.max(16, Math.min(24, Math.round(rowH * (twoLine ? 0.26 : 0.42))));
        const row = make("g", {});
        row.appendChild(make("rect", { x, y: y - 10, width: 20, height: 20, rx: 3, fill: color }));
        const nameText = make("text", { x: x + 30, y: twoLine ? y + 2 : y + size * 0.36,
          class: "legend-name", style: "font-size:" + size + "px" });
        nameText.textContent = clipTo(name, right - x - 30, size);
        const valueText = make("text", { x: right, y: twoLine ? y + size * 1.15 : y + size * 0.36,
          "text-anchor": "end", class: "legend-value", style: "font-size:" + Math.max(16, Math.round(size * 0.8)) + "px" });
        valueText.textContent = value;
        row.append(nameText, valueText);
        return row;
      };

      if (chart === "bars") {
        // 画全部行：facts 的 count/spread 是全量口径，截断会让口播和画面互相打脸。
        const top = rows.slice().sort((a, b) => b.value - a.value);
        const max = Math.max(...top.map((row) => row.value)) || 1;
        const rowH = (H - pad.top - pad.bottom) / Math.max(top.length, 1);
        const typeSize = Math.max(16, Math.min(28, Math.round(rowH * 0.44)));
        const fontStyle = "font-size:" + typeSize + "px";
        const x0 = 430;
        // 右侧留 210：最长那条的数值要落在柱子外面，不压柱身。
        const x1 = W - pad.right - 210;
        const bars = [];
        top.forEach((row, index) => {
          const y = pad.top + index * rowH + rowH * 0.16;
          const height = rowH * 0.56;
          const label = make("text", { x: pad.left, y: y + height * 0.72, class: "bar-label", style: fontStyle });
          label.textContent = clip(row.label);
          const bar = make("rect", { x: x0, y, width: Math.max(6, (row.value / max) * (x1 - x0)), height, rx: 6, class: "bar" });
          const value = make("text", { x: W - pad.right, y: y + height * 0.72, "text-anchor": "end",
            class: "bar-value", style: fontStyle });
          value.textContent = fmt(row.value) + " " + unit;
          svg.append(label, bar, value);
          bars.push(bar);
          chartEvidence.rows.set(row.label, { label, bar, value });
        });
        tl.from(bars, { scaleX: 0, duration: 1.1, stagger: Math.min(0.1, 1.2 / bars.length), ease: "power3.out" }, 0.8);
      } else if (chart === "race") {
        // long 形态：(date, series, value)。全部实体都建节点，超出可视窗口的沉到槽位下方由 overflow 裁掉。
        const { byName, dates: timeline } = parseLong();
        const names = Array.from(byName.keys());
        const visibleMax = Math.max(1, Math.min(names.length, 14));
        const rowH = (H - pad.top - pad.bottom) / visibleMax;
        const typeSize = Math.max(16, Math.min(28, Math.round(rowH * 0.44)));
        const fontStyle = "font-size:" + typeSize + "px";
        const barH = Math.max(6, rowH * 0.56);
        const x0 = 430;
        const x1 = W - pad.right - 210;
        const offSlot = H + rowH;
        const nodes = new Map();
        names.forEach((name) => {
          const label = make("text", { x: pad.left, y: offSlot, class: "bar-label", style: fontStyle });
          label.textContent = clip(name);
          const bar = make("rect", { x: x0, y: offSlot, width: 0, height: barH, rx: 6, class: "bar" });
          const value = make("text", { x: W - pad.right, y: offSlot, "text-anchor": "end",
            class: "bar-value", style: fontStyle });
          svg.append(label, bar, value);
          nodes.set(name, { label, bar, value });
          chartEvidence.rows.set(name, { label, bar, value });
        });
        const start = introDrawStart;
        const step = Math.max(0.04, (introDrawEnd - start - 0.5) / Math.max(timeline.length - 1, 1));
        chartEvidence.race = { start, step, frames: [] };
        const move = (node, y, at, duration) => {
          tl.to(node.bar, { attr: { y }, duration, ease: "power2.out" }, at);
          tl.to(node.label, { attr: { y: y + barH * 0.72 }, duration, ease: "power2.out" }, at);
          tl.to(node.value, { attr: { y: y + barH * 0.72 }, duration, ease: "power2.out" }, at);
        };
        timeline.forEach((date, index) => {
          const ranked = names
            .map((name) => ({ name, value: byName.get(name).get(date) }))
            .filter((item) => Number.isFinite(item.value))
            .sort((a, b) => b.value - a.value);
          const max = ranked.length ? ranked[0].value : 1;
          const at = start + index * step;
          const duration = index === 0 ? 0.5 : step * 0.85;
          chartEvidence.race.frames.push({ date, ranked });
          ranked.forEach((item, rank) => {
            const node = nodes.get(item.name);
            const hidden = rank >= visibleMax;
            const y = hidden ? offSlot : pad.top + rank * rowH + rowH * 0.16;
            move(node, y, at, duration);
            tl.to(node.bar, { attr: { width: Math.max(6, (item.value / max) * (x1 - x0)) },
              duration, ease: "power2.out" }, at);
            // 文本由focus.js按当前帧重算，避免seek回调一次执行完而提前显示终局数值。
          });
        });
      } else if (chart === "stacked") {
        // 份额堆叠：每个日期归一到 100%，系列按末日规模排序，前 9 名 + 其他，避免 20 条带子糊成一片。
        const { byName, dates } = parseLong();
        const ranked = Array.from(byName.entries())
          .map(([name, points]) => ({ name, points, last: lastValue(points, dates) }))
          .filter((item) => Number.isFinite(item.last) && item.last > 0)
          .sort((a, b) => b.last - a.last);
        const bands = ranked.slice(0, 9)
          .map((item) => ({ name: item.name, get: (date) => item.points.get(date) || 0 }));
        const rest = ranked.slice(9);
        if (rest.length) {
          bands.push({ name: "其他", get: (date) => rest.reduce((sum, item) => sum + (item.points.get(date) || 0), 0) });
        }
        const totals = dates.map((date) => bands.reduce((sum, band) => sum + band.get(date), 0));
        const shareOf = (band, index) => totals[index] ? (band.get(dates[index]) / totals[index]) * 100 : 0;
        const padL = 96;
        const padR = 292;
        const padT = 44;
        const padB = 68;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const xOf = (index) => padL + (index / Math.max(dates.length - 1, 1)) * plotW;
        const yOf = (pct) => padT + (1 - pct / 100) * plotH;
        for (let i = 0; i <= 4; i++) {
          const yy = yOf(i * 25);
          svg.appendChild(make("line", { x1: padL, y1: yy, x2: padL + plotW, y2: yy, class: "axis" }));
          const label = make("text", { x: padL - 14, y: yy + 9, "text-anchor": "end", class: "axis-label" });
          label.textContent = i * 25 + "%";
          svg.appendChild(label);
        }
        const note = make("text", { x: padL, y: padT - 14, class: "chart-note" });
        note.textContent = "份额 %";
        const shortDate = (date) => date.endsWith("-01-01") ? date.slice(0, 4) : date;
        const first = make("text", { x: padL, y: H - padB + 40, class: "axis-label" });
        first.textContent = shortDate(dates[0]);
        const last = make("text", { x: padL + plotW, y: H - padB + 40, "text-anchor": "end", class: "axis-label" });
        last.textContent = shortDate(dates[dates.length - 1]);
        const axisLabels = make("g", {});
        axisLabels.append(first, last);
        svg.append(note, axisLabels);
        const defs = make("defs", {});
        const revealRect = make("rect", { x: padL - 2, y: 0, width: 0, height: H });
        const revealClip = make("clipPath", { id: "stack-reveal" });
        revealClip.appendChild(revealRect);
        defs.appendChild(revealClip);
        svg.appendChild(defs);
        const bandGroup = make("g", { "clip-path": "url(#stack-reveal)" });
        svg.appendChild(bandGroup);
        const cumulative = dates.map(() => 0);
        const legendX = padL + plotW + 24;
        const legendRight = W - 36;
        const rowH = plotH / Math.max(bands.length, 1);
        const legendRows = [];
        bands.forEach((band, index) => {
          const color = seriesColor(index, bands.length);
          const tops = [];
          const bottoms = [];
          dates.forEach((date, i) => {
            const share = shareOf(band, i);
            bottoms.push(cumulative[i]);
            cumulative[i] += share;
            tops.push(cumulative[i]);
          });
          const forward = tops.map((value, i) => (i ? "L" : "M") + xOf(i).toFixed(1) + "," + yOf(value).toFixed(1));
          const backward = dates.map((_, i) =>
            "L" + xOf(dates.length - 1 - i).toFixed(1) + "," + yOf(bottoms[dates.length - 1 - i]).toFixed(1));
          const shape = make("path", { d: forward.concat(backward).join(" ") + " Z", class: "band", fill: color });
          bandGroup.appendChild(shape);
          const row = legendItem(legendX, legendRight, padT + index * rowH + rowH / 2, rowH, color,
            band.name, shareOf(band, dates.length - 1).toFixed(1) + "%");
          svg.appendChild(row);
          legendRows.push(row);
          chartEvidence.series.set(band.name, { shape, legend: row });
        });
        const drawStart = introDrawStart;
        const drawDur = introDrawDuration;
        tl.to(revealRect, { attr: { width: plotW + 4 }, duration: drawDur, ease: "none" }, drawStart);
        tl.from(axisLabels, { opacity: 0, duration: 0.5, ease: "sine.out" }, drawStart);
        tl.from(legendRows, { opacity: 0, x: 18, duration: 0.5, stagger: Math.min(0.08, 0.8 / Math.max(bands.length, 1)), ease: "power2.out" }, drawStart + 0.2);
      } else if (chart === "multiline") {
        // 多线对照：各系列按首个有效值归一到 100；系列超过 20 只画前 20，图例注明。
        const { byName, dates } = parseLong();
        const all = Array.from(byName.entries())
          .map(([name, points]) => ({
            name,
            points,
            base: dates.map((date) => points.get(date))
              .find((value) => Number.isFinite(value) && value !== 0)
          }))
          .filter((item) => Number.isFinite(item.base))
          .map((item) => ({ ...item, last: lastValue(item.points, dates) }))
          .sort((a, b) => b.last - a.last);
        const entries = all.slice(0, 20);
        const series = entries.map((item) => {
          const points = dates.map((date) => item.points.has(date) ? (item.points.get(date) / item.base) * 100 : NaN);
          let final = NaN;
          for (let i = points.length - 1; i >= 0; i--) {
            if (Number.isFinite(points[i])) { final = points[i]; break; }
          }
          return { name: item.name, points, final };
        });
        const flat = series.flatMap((item) => item.points).filter(Number.isFinite);
        let lo = Math.min(100, ...flat);
        let hi = Math.max(100, ...flat);
        const padL = 96;
        const padR = 292;
        const padT = 48;
        const padB = 68;
        const plotW = W - padL - padR;
        const plotH = H - padT - padB;
        const raw = (hi - lo) / 4 || 1;
        const pow = Math.pow(10, Math.floor(Math.log10(raw)));
        const factor = raw / pow;
        let step = (factor <= 1 ? 1 : factor <= 2 ? 2 : factor <= 5 ? 5 : 10) * pow;
        while ((hi - lo) / step > 6) step *= 2;
        lo = Math.floor(lo / step) * step;
        hi = Math.ceil(hi / step) * step;
        const xOf = (index) => padL + (index / Math.max(dates.length - 1, 1)) * plotW;
        const yOf = (value) => padT + (1 - (value - lo) / (hi - lo || 1)) * plotH;
        const tickText = (value) => step < 1 ? value.toFixed(1) : String(Math.round(value));
        for (let value = lo; value <= hi + step * 0.001; value += step) {
          const yy = yOf(value);
          svg.appendChild(make("line", { x1: padL, y1: yy, x2: padL + plotW, y2: yy, class: "axis" }));
          const label = make("text", { x: padL - 14, y: yy + 9, "text-anchor": "end", class: "axis-label" });
          label.textContent = tickText(value);
          svg.appendChild(label);
        }
        svg.appendChild(make("line", { x1: padL, y1: yOf(100), x2: padL + plotW, y2: yOf(100), class: "baseline" }));
        const note = make("text", { x: padL, y: padT - 14, class: "chart-note" });
        note.textContent = "指数（基期=100）" + (all.length > entries.length ? " · 显示前 20 项" : "");
        const shortDate = (date) => date.endsWith("-01-01") ? date.slice(0, 4) : date;
        const first = make("text", { x: padL, y: H - padB + 40, class: "axis-label" });
        first.textContent = shortDate(dates[0]);
        const last = make("text", { x: padL + plotW, y: H - padB + 40, "text-anchor": "end", class: "axis-label" });
        last.textContent = shortDate(dates[dates.length - 1]);
        const axisLabels = make("g", {});
        axisLabels.append(first, last);
        svg.append(note, axisLabels);
        const drawStart = introDrawStart;
        const drawDur = introDrawDuration;
        const stagger = Math.min(0.06, (drawDur * 0.35) / Math.max(series.length, 1));
        const legendX = padL + plotW + 24;
        const legendRight = W - 36;
        const rowH = plotH / Math.max(series.length, 1);
        const legendRows = [];
        series.forEach((item, index) => {
          let d = "";
          let drawing = false;
          item.points.forEach((value, i) => {
            if (!Number.isFinite(value)) { drawing = false; return; }
            d += (drawing ? "L" : "M") + xOf(i).toFixed(1) + "," + yOf(value).toFixed(1);
            drawing = true;
          });
          const path = make("path", { d, class: "multi-line", stroke: seriesColor(index, series.length),
            "stroke-width": series.length > 12 ? 4 : 5 });
          svg.appendChild(path);
          const length = path.getTotalLength();
          gsap.set(path, { strokeDasharray: length, strokeDashoffset: length });
          tl.to(path, { strokeDashoffset: 0, duration: drawDur, ease: "none" }, drawStart + index * stagger);
          const row = legendItem(legendX, legendRight, padT + index * rowH + rowH / 2, rowH,
            seriesColor(index, series.length), item.name, Number.isFinite(item.final) ? item.final.toFixed(0) : "—");
          svg.appendChild(row);
          legendRows.push(row);
          chartEvidence.series.set(item.name, { shape: path, legend: row });
        });
        tl.from(axisLabels, { opacity: 0, duration: 0.5, ease: "sine.out" }, drawStart);
        tl.from(legendRows, { opacity: 0, x: 18, duration: 0.5, stagger: Math.min(0.06, 0.8 / Math.max(series.length, 1)), ease: "power2.out" }, drawStart + 0.2);
      } else if (chart === "radar") {
        // 雷达：每个系列一根轴，取最后有效值；半径按所有轴的最大值归一，形状反映彼此的相对量级。
        const { byName, dates } = parseLong();
        const all = Array.from(byName.entries()).map(([name, points]) => {
          return { name, last: lastValue(points, dates) };
        }).filter((item) => Number.isFinite(item.last) && item.last > 0)
          .sort((a, b) => b.last - a.last);
        const axes = all.slice(0, 12);
        const n = axes.length;
        const maxLast = Math.max(...axes.map((item) => item.last), 1);
        const ratioOf = (item) => Math.max(0, Math.min(1, item.last / maxLast));
        const cx = W / 2;
        const cy = H / 2;
        const R = Math.min(W, H) * 0.33;
        const angleOf = (index) => (-90 + (index * 360) / Math.max(n, 1)) * Math.PI / 180;
        const pointOf = (index, ratio) => [
          cx + Math.cos(angleOf(index)) * R * ratio,
          cy + Math.sin(angleOf(index)) * R * ratio
        ];
        [0.25, 0.5, 0.75, 1].forEach((level) => {
          const points = Array.from({ length: n }, (_, i) => pointOf(i, level).map((v) => v.toFixed(1)).join(",")).join(" ");
          svg.appendChild(make("polygon", { points, class: "radar-grid" }));
        });
        const arc = (2 * Math.PI * (R + 24)) / Math.max(n, 1);
        const allowed = arc * 0.92;
        // 字号按最长系列名反推：英文约 0.56em、中文 1em，下限 16。
        const nameUnits = Math.max(...axes.map((item) =>
          Array.from(item.name).reduce((sum, ch) => sum + charEm(ch), 0)), 1);
        const typeSize = Math.max(16, Math.min(24, Math.floor(allowed / nameUnits)));
        const labels = [];
        const dots = [];
        axes.forEach((item, index) => {
          const [x, y] = pointOf(index, 1);
          svg.appendChild(make("line", { x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1), class: "radar-spoke" }));
          const a = angleOf(index);
          const lx = cx + Math.cos(a) * (R + 24);
          const ly = cy + Math.sin(a) * (R + 24);
          const anchor = Math.cos(a) > 0.3 ? "start" : Math.cos(a) < -0.3 ? "end" : "middle";
          const label = make("text", { x: lx.toFixed(1), y: ly.toFixed(1), "text-anchor": anchor,
            class: "radar-label", style: "font-size:" + typeSize + "px", "dominant-baseline": "middle" });
          label.textContent = clipTo(item.name, allowed, typeSize);
          const value = make("tspan", { x: lx.toFixed(1), dy: typeSize * 0.9, class: "radar-value",
            style: "font-size:" + Math.max(16, Math.round(typeSize * 0.78)) + "px" });
          value.textContent = clipTo(fmt(item.last), allowed, typeSize * 0.78);
          label.appendChild(value);
          svg.appendChild(label);
          labels.push(label);
          const [dx, dy] = pointOf(index, ratioOf(item));
          const dot = make("circle", { cx: dx.toFixed(1), cy: dy.toFixed(1), r: 8, class: "radar-dot" });
          svg.appendChild(dot);
          dots.push(dot);
          chartEvidence.series.set(item.name, { shape: dot, legend: label });
        });
        const polyPoints = axes.map((item, index) =>
          pointOf(index, ratioOf(item)).map((v) => v.toFixed(1)).join(",")).join(" ");
        const poly = make("polygon", { points: polyPoints, class: "radar-poly" });
        if (dots.length) svg.insertBefore(poly, dots[0]);
        else svg.appendChild(poly);
        const note = make("text", { x: 24, y: 34, class: "chart-note" });
        note.textContent = "各系列最新值 · 按最大值归一" + (all.length > axes.length ? " · 显示前 12 项" : "");
        svg.appendChild(note);
        tl.from(svg.querySelectorAll(".radar-grid"), { opacity: 0, duration: 0.5, stagger: 0.1, ease: "sine.out" }, 0.6);
        tl.from(svg.querySelectorAll(".radar-spoke"), { opacity: 0, duration: 0.4, stagger: 0.03 }, 0.7);
        tl.from(poly, { scale: 0.15, opacity: 0, duration: 1.2, ease: "back.out(1.3)", svgOrigin: cx + " " + cy }, 1.1);
        tl.from(dots, { attr: { r: 0 }, duration: 0.4, stagger: 0.04, ease: "back.out(2)" }, 1.6);
        tl.from(labels, { opacity: 0, duration: 0.4, stagger: 0.03 }, 1.7);
        tl.from(note, { opacity: 0, duration: 0.4, ease: "sine.out" }, 0.8);
      } else {
        const values = rows.map((row) => row.value);
        let min = Math.min(...values);
        let max = Math.max(...values);
        const span = max - min || 1;
        min -= span * 0.14;
        max += span * 0.14;
        const x = (index) => pad.left + (index / Math.max(rows.length - 1, 1)) * (W - pad.left - pad.right);
        const y = (value) => pad.top + (1 - (value - min) / (max - min)) * (H - pad.top - pad.bottom);
        for (let i = 0; i < 4; i++) {
          const yy = pad.top + (i * (H - pad.top - pad.bottom)) / 3;
          svg.appendChild(make("line", { x1: pad.left, y1: yy, x2: W - pad.right, y2: yy, class: "axis" }));
          const label = make("text", { x: pad.left - 14, y: yy + 9, "text-anchor": "end", class: "axis-label" });
          label.textContent = fmt(max - (i * (max - min)) / 3);
          svg.appendChild(label);
        }
        const line = rows.map((row, index) => (index ? "L" : "M") + x(index) + "," + y(row.value)).join(" ");
        const area = line + " L" + x(rows.length - 1) + "," + (H - pad.bottom) + " L" + x(0) + "," + (H - pad.bottom) + " Z";
        const areaPath = make("path", { d: area, class: "series-area" });
        // 面积跟着折线一起推进；整块先出现会把结尾走势提前泄底。
        const revealRect = make("rect", { x: 0, y: 0, width: 0, height: H });
        const revealClip = make("clipPath", { id: "area-reveal" });
        revealClip.appendChild(revealRect);
        const defs = make("defs", {});
        defs.appendChild(revealClip);
        areaPath.setAttribute("clip-path", "url(#area-reveal)");
        svg.append(defs, areaPath);
        const path = make("path", { d: line, class: "series-line" });
        svg.appendChild(path);
        const dot = make("circle", { cx: x(rows.length - 1), cy: y(rows[rows.length - 1].value), r: 12, class: "dot" });
        svg.appendChild(dot);
        const dotLabel = make("text", { x: x(rows.length - 1), y: y(rows[rows.length - 1].value) - 26,
          "text-anchor": "end", class: "dot-label" });
        dotLabel.textContent = fmt(rows[rows.length - 1].value) + " " + unit;
        svg.appendChild(dotLabel);
        const shortDate = (date) => date.endsWith("-01-01") ? date.slice(0, 4) : date;
        const first = make("text", { x: pad.left, y: H - pad.bottom + 42, class: "axis-label" });
        first.textContent = shortDate(rows[0].label);
        const last = make("text", { x: W - pad.right, y: H - pad.bottom + 42, "text-anchor": "end", class: "axis-label" });
        last.textContent = shortDate(rows[rows.length - 1].label);
        svg.append(first, last);
        const length = path.getTotalLength();
        gsap.set(path, { strokeDasharray: length, strokeDashoffset: length });
        tl.to(path, { strokeDashoffset: 0, duration: introDrawDuration, ease: "none" }, introDrawStart);
        tl.to(revealRect, { attr: { width: W }, duration: introDrawDuration, ease: "none" }, introDrawStart);
        tl.from(dot, { scale: 0, transformOrigin: "center", duration: 0.5, ease: "back.out(2)" }, introDrawEnd - 0.2);
        tl.from(dotLabel, { opacity: 0, y: 12, duration: 0.5, ease: "power2.out" }, introDrawEnd);
        // 有限次呼吸，保持后段画面有动感；不用 repeat:-1，保证可 seek。
        const pulseRepeats = Math.max(0, Math.floor((total - introDrawEnd - 1) / 2) - 1);
        if (pulseRepeats > 0) {
          tl.to(dot, { scale: 1.3, transformOrigin: "center", duration: 0.9, yoyo: true,
            repeat: pulseRepeats, ease: "sine.inOut" }, introDrawEnd + 0.7);
        }
        const annotate = (index, text, color) => {
          if (index < 0 || index >= rows.length) return;
          const cx = x(index);
          const cy = y(rows[index].value);
          const anchor = cx > W * 0.72 ? "end" : "start";
          const labelY = cy < 90 ? cy + 34 : cy - 18;
          const group = make("g", {});
          const point = make("circle", { cx, cy, r: 7, fill: color });
          const label = make("text", { x: cx + (anchor === "end" ? -14 : 14), y: labelY,
            "text-anchor": anchor, class: "annotation" });
          label.textContent = text;
          group.append(point, label);
          svg.appendChild(group);
          tl.from(group, { opacity: 0, duration: 0.4, ease: "sine.out" },
            introDrawStart + introDrawDuration * (index / Math.max(rows.length - 1, 1)));
        };
        const maxIndex = rows.findIndex((row) => row.label === (facts.max && facts.max.date));
        const minIndex = rows.findIndex((row) => row.label === (facts.min && facts.min.date));
        [["first", 0], ["last", rows.length - 1], ["min", minIndex], ["max", maxIndex]].forEach(([key, index]) => {
          if (index >= 0) chartEvidence.points.set(key, { x: x(index), y: y(rows[index].value) });
        });
        // 极值点离末点太近就不标注：末点自己的数值标签已经在那个位置了，
        // 两个标签叠在一起谁都看不清（最低点落在最后两期时最常见）。
        const lastX = x(rows.length - 1);
        const lastY = y(rows[rows.length - 1].value);
        const crowded = (index) => Math.abs(x(index) - lastX) < 90 && Math.abs(y(rows[index].value) - lastY) < 48;
        if (maxIndex >= 0 && !crowded(maxIndex)) {
          annotate(maxIndex, "最高 " + fmt(facts.max.value), "#18b7c9");
        }
        if (minIndex >= 0 && !crowded(minIndex)) {
          annotate(minIndex, "最低 " + fmt(facts.min.value), "#e06c5a");
        }
      }

// 每段的画面重点来自Java解析的事实引用，时间来自真实口播。所有帧都从时间轴绝对时间重算。
const focusWindows = [...document.querySelectorAll(".scene")]
  .filter((slot) => Number(slot.dataset.sceneIndex) <= sceneCount)
  .map((slot) => ({
    start: Number(slot.dataset.start),
    end: Number(slot.dataset.start) + Number(slot.dataset.duration),
    focus: JSON.parse(declared["scene" + slot.dataset.sceneIndex + "_focus"] || "{}"),
  }));
const focusCaption = document.getElementById("focus-caption");
const focusLayer = make("g", { "aria-hidden": "true" });
svg.appendChild(focusLayer);
const factAt = (path) => path.split(".").reduce((node, key) =>
  node != null && Object.hasOwn(node, key) ? node[key] : undefined, facts);
const signed = (value) => (value > 0 ? "+" : "") + fmt(value);
const captionText = (value) => {
  const text = Array.from(String(value));
  const max = /[一-鿿]/.test(value) ? 28 : 50;
  return text.length > max ? text.slice(0, max - 1).join("") + "…" : text.join("");
};
const periodText = () => {
  const start = facts.first && facts.first.date;
  const end = facts.last && facts.last.date;
  if (!start || !end) return "同一快照";
  return start.slice(0, 4) === end.slice(0, 4)
    ? start.slice(5) + " → " + end.slice(5) : start.slice(0, 4) + " → " + end.slice(0, 4);
};
function focusValue(focus) {
  const refs = focus.refs || [];
  const labels = focus.labels || [];
  const base = facts.last || facts.leader || {};
  const result = { value: base.value, unit, detail: "", caption: dataset.metric.label || "数据全貌", signed: false };
  if (typeof facts.change === "number") {
    result.detail = (facts.change >= 0 ? "▲ " : "▼ ") + fmt(Math.abs(facts.change));
    if (typeof facts.change_pct === "number") result.detail += "（" + Math.abs(facts.change_pct).toFixed(2) + "%）";
  } else if (facts.leader) {
    result.detail = facts.leader.label || facts.leader.name || facts.leader.location || "";
  }
  if (focus.mode === "change") {
    const pct = !refs.includes("change") && refs.includes("change_pct");
    result.value = pct ? facts.change_pct : facts.change;
    result.unit = pct ? "%" : unit;
    result.detail = pct ? signed(facts.change) + " " + unit
      : typeof facts.change_pct === "number" ? signed(facts.change_pct) + "%" : "";
    result.caption = (pct ? "区间涨跌幅 · " : "区间首末变化 · ") + periodText();
    result.signed = true;
  } else if (focus.mode === "range") {
    const key = (refs.find((ref) => ref.startsWith("min.") || ref.startsWith("max.")) || "max.value").split(".")[0];
    const point = facts[key];
    if (point) {
      result.value = point.value;
      result.caption = (key === "min" ? "区间最低 · " : "区间最高 · ") + (point.date || "同一快照");
      result.detail = "";
    }
  } else if (focus.mode === "comparison") {
    result.caption = typeof facts.spread === "number" ? "首尾差距 · 同一快照" : "区间首末对比 · " + periodText();
    result.value = typeof facts.spread === "number" ? facts.spread : base.value;
    result.detail = facts.first ? "起点 " + fmt(facts.first.value) + " " + unit : "";
  } else if (focus.mode === "item" || focus.mode === "leader") {
    const entities = [...(facts.items || []), ...(facts.series || []), ...(facts.leader ? [facts.leader] : [])];
    const item = entities.find((entry) => labels.includes(entry.label || entry.name || entry.location));
    if (item) {
      const ref = refs.find((ref) => /^(items\.\d+|series\.\d+|leader)\.(value|first|last|min|max|change|change_pct)$/.test(ref)
        && typeof factAt(ref) === "number");
      const field = ref && ref.split(".").at(-1);
      result.value = ref ? factAt(ref) : typeof item.value === "number" ? item.value : item.last;
      result.unit = field === "change_pct" ? "%" : unit;
      result.signed = field === "change" || field === "change_pct";
      result.detail = "";
      const meaning = { first: "起点", last: "最新值", min: "最低", max: "最高", change: "区间变化", change_pct: "区间涨跌幅" };
      result.caption = (item.label || item.name || item.location) + " · " + (meaning[field] || "数值");
    }
  } else if (focus.mode === "latest") {
    const key = refs.some((ref) => ref.startsWith("last.")) ? "last" : "first";
    if (facts[key]) {
      result.value = facts[key].value;
      result.caption = (key === "last" ? "最新数值 · " : "区间起点 · ") + (facts[key].date || "同一快照");
    }

}
let paintedFocus = -2;
function paintEvidence(focus, index) {
  if (paintedFocus === index) return;
  paintedFocus = index;
  focusLayer.replaceChildren();
  const refs = focus.refs || [];
  let keys = refs.map((ref) => ref.split(".")[0]).filter((key) => chartEvidence.points.has(key));
  if (focus.mode === "change" || focus.mode === "comparison") keys = ["first", "last"];
  const points = [...new Set(keys)].map((key) => chartEvidence.points.get(key)).filter(Boolean);
  if (points.length === 2) {
    focusLayer.appendChild(make("path", { d: "M" + points[0].x + "," + points[0].y
      + " L" + points[1].x + "," + points[1].y, class: "focus-link" }));
  }
  points.forEach((point) => {
    focusLayer.appendChild(make("circle", { cx: point.x, cy: point.y, r: 23, class: "focus-halo" }));
    focusLayer.appendChild(make("circle", { cx: point.x, cy: point.y, r: 11, class: "focus-ring" }));
  });
  const selected = new Set(focus.labels || []);
  if (focus.mode === "comparison" && chartEvidence.rows.size) {
    const names = [...chartEvidence.rows.keys()];
    selected.add(names[0]);
    selected.add(names[names.length - 1]);
  }
  chartEvidence.rows.forEach((node, name) => {
    const active = selected.size === 0 || selected.has(name);
    node.bar.style.opacity = active ? "1" : "0.55";
    node.label.style.fontWeight = selected.has(name) ? "800" : "600";
    node.value.style.fill = active ? "var(--fg)" : "var(--muted-2)";
  });
  chartEvidence.series.forEach((node, name) => {
    const active = selected.size === 0 || selected.has(name);
    node.shape.style.filter = active ? "" : "brightness(0.55)";
    node.legend.style.fontWeight = selected.has(name) ? "800" : "600";

}
function paintFocus() {
  const t = tl.time();
  const index = focusWindows.findIndex((slot) => slot.start <= t && t < slot.end);
  const focus = index >= 0 ? focusWindows[index].focus : {};
  paintEvidence(focus, index);
  let display = focusValue(focus);
  if (chartEvidence.race && chartEvidence.race.frames.length) {
    const race = chartEvidence.race;
    const frameIndex = Math.max(0, Math.min(race.frames.length - 1, Math.floor((t - race.start) / race.step)));
    const frame = race.frames[frameIndex];
    const values = new Map(frame.ranked.map((item) => [item.name, item.value]));
    chartEvidence.rows.forEach((node, name) => {
      node.value.textContent = values.has(name) ? fmt(values.get(name)) + " " + unit : "";
    });
    const leader = frame.ranked[0];
    display = { value: leader && leader.value, unit, detail: leader ? leader.name : "", signed: false,
      caption: frame.date + " · 当期榜首" };
  }
  if (Number.isFinite(display.value)) {
    // 只在片头滚动数字；之后展示本段实际事实值，避免过渡中的数值被误当作新事实。
    const progress = !chartEvidence.race ? Math.max(0, Math.min(1, (t - 0.35) / 1.2)) : 1;
    const value = t < 1.55 && !chartEvidence.race ? display.value * (1 - Math.pow(1 - progress, 3)) : display.value;
    const kpi = document.getElementById("kpi-value");
    kpi.textContent = display.signed ? signed(value) : fmt(value);
    kpi.style.color = display.signed && display.value < 0 ? "var(--down)" : "var(--accent)";
    document.getElementById("kpi-unit").textContent = display.unit;
    document.getElementById("kpi-change").textContent = display.detail;

paintFocus();
const focusClock = { time: 0 };
tl.to(focusClock, { time: total, duration: total, ease: "none", onUpdate: paintFocus }, 0);

// 全局时间线与场景进出。所有模板共用，必须在 chart 之后执行。
// 只做三个动作：enter / ambient / swap。参数全部来自令牌，
// 风格差异靠改令牌而不是另写一套动画——否则三套风格很快就会长成三份真相。
// 数字滚动不在这里：KPI 的小数位与单位随数据集变化，由 chart.js 按 precision 驱动。
const has = (selector) => document.querySelector(selector) !== null;
const numberVar = (name, fallback) => {
  const value = parseFloat(cssVar(name));
  return Number.isFinite(value) ? value : fallback;
};
const EASE_OUT = cssVar("--ease-out") || "power3.out";
const EASE_IN = cssVar("--ease-in") || "power2.in";
const DUR = {
  entrance: numberVar("--dur-entrance", 0.5),
  swap: numberVar("--dur-swap", 0.3),
  ambient: numberVar("--dur-ambient", 7),
};
const FROM = { up: { y: 30 }, down: { y: -30 }, left: { x: 46 }, right: { x: -46 }, none: {} };

// immediateRender：动画排在中段时 GSAP 默认不提前写起始值，元素会先裸着露出来
function enter(targets, { dir = "up", at = 0, stagger = 0 } = {}) {
  if (!targets) return;
  const list = typeof targets === "string" ? document.querySelectorAll(targets) : targets;
  if (!list || (!list.nodeType && !list.length)) return;
  tl.from(list, { ...FROM[dir], opacity: 0, duration: DUR.entrance, ease: EASE_OUT, stagger, immediateRender: true }, at);
}

function ambient(scope = document) {
  scope.querySelectorAll("[data-ambient]").forEach((el) => {
    const base = parseFloat(getComputedStyle(el).opacity);
    const dim = Number.isFinite(base) ? base : 1;
    const kind = el.dataset.ambient;
    const nominal = DUR.ambient * (kind === "pulse" ? 0.8 : kind === "flicker" ? 0.35 : 1);
    const cycles = Math.max(1, Math.ceil(total / nominal));
    const duration = total / cycles;
    if (kind === "drift") {
      tl.to(el, { x: 18, y: -14, duration, ease: "sine.inOut", repeat: cycles - 1, yoyo: true }, 0);
    } else if (kind === "pulse") {
      tl.to(el, { opacity: dim * 0.55, scale: 1.06, duration, ease: "sine.inOut", repeat: cycles - 1, yoyo: true }, 0);
    } else if (kind === "flicker") {
      tl.to(el, { opacity: dim * 0.7, duration, ease: "sine.inOut", repeat: cycles - 1, yoyo: true }, 0);
    }

function swap(slot, start, outAt) {
  const parts = slot.querySelectorAll(".scene-no, .lead, .body");
  if (!parts.length) return;
  tl.from(parts, { y: 26, opacity: 0, duration: DUR.entrance, ease: EASE_OUT, stagger: 0.08, immediateRender: true }, start);
  // 短屏时退场不能排在入场之前
  tl.to(parts, { y: -14, opacity: 0, duration: DUR.swap, ease: EASE_IN, stagger: 0.04 }, Math.max(start + DUR.entrance, outAt));

ambient();

tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: total, ease: "none" }, 0);
enter("#kicker", { dir: "left", at: 0.1 });
enter("#title", { dir: "up", at: 0.2 });
tl.from("#rule", { scaleX: 0, duration: DUR.entrance, ease: EASE_OUT, immediateRender: true }, 0.45);
if (has("#kpi")) enter("#kpi", { dir: "up", at: 0.35 });
enter("#aigc-badge", { dir: "none", at: 0.2 });
// 数据图表常驻时保留选题标题，避免后半片只剩孤立数字；文稿线沿用原退场。
if (!has("#chart")) tl.to("#title, #rule", { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 3.6);

// 版式自带的静态装饰（#plate / #rail / #tick）。它们不来自数据，
// 但各自有动画：没有动画的装饰层等于死图层。
if (has("#plate")) {
  tl.fromTo("#plate", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.inOut" }, 0.05);
}
if (has("#rail")) {
  tl.fromTo("#rail", { scaleY: 0 }, { scaleY: 1, duration: total, ease: "none" }, 0);

const tick = document.getElementById("tick");

  const pad = (n) => String(n).padStart(2, "0");
  const starts = [...document.querySelectorAll(".scene")]
    .filter((slot) => Number(slot.dataset.sceneIndex) <= sceneCount)
    .map((slot) => parseFloat(slot.dataset.start));
  tl.to(tick, {
    duration: total,
    ease: "none",
    onUpdate: () => {
      const t = tl.time();
      const hit = starts.filter((start) => start <= t).length;

}

const closingSlot = document.getElementById("closing-slot");
const closingAt = closingSlot ? parseFloat(closingSlot.dataset.start) : NaN;
const hasClosing = Number.isFinite(closingAt) && closingAt < total - 0.1;

document.querySelectorAll(".scene").forEach((slot) => {
  if (Number(slot.dataset.sceneIndex) > sceneCount) {
    slot.hidden = true;
    slot.style.display = "none";
    return;
  }
  const start = parseFloat(slot.dataset.start);
  const end = start + parseFloat(slot.dataset.duration);
  swap(slot, start, end - DUR.swap);

  enter(closingSlot.querySelector("#closing"), { dir: "up", at: closingAt });
}

window.__timelines["main"] = tl;
