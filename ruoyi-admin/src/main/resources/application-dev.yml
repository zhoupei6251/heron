--- # Heron 本机开发覆盖（Windows 直跑渲染，见 docs/plans/2026-11-03-heron-implementation-design.md §4）
heron:
  production:
    # PATH 上没有 python3.exe；监护脚本只在 Linux 生效，开发机显式关闭而不是自动降级
    python: python
    guard-enabled: false
    # nvm-windows 的 node 是机器级符号链接，会被别的会话切回 20.x，而 hyperframes 要求 Node ≥22
    # 本机需要钉版本时设 HERON_NODE，默认走 PATH
    node: ${HERON_NODE:node}
    hyperframes: ${HERON_HYPERFRAMES:./data/tools/node_modules/hyperframes/bin/hyperframes.mjs}
    news-template: ${HERON_NEWS_TEMPLATE:./data/templates}
    # zee-rp 只作 oracle：引擎根目录（内含 scripts/proto.mjs），本机解包在 D:/zhoupei/tmp 下
    zee-rp: D:/zhoupei/tmp/zee-rp-v0.2.1
    # Axure RP9 空白基底，在两仓库之外；引擎读它需要 AXURE_BLANK_TEMPLATE_RP9，由 Java 注入子进程
    prototype-template: D:/zhoupei/heron/axure/blank-rp9.rp
    worker-enabled: true
    # 定稿产物落七牛 Kodo（S3 兼容）；桶名与密钥在 sys_oss_config 的 qiniu 行里，不进 Git
    oss-config-key: qiniu
  prototype:
    # 装配流水线：引擎根 + 模板卷 + 模型都到位才打开
    engine-enabled: true
    # 人工核对过的引擎能力声明（tag v0.2.1 的提交号）；启动时仍要比引擎目录实际 HEAD 与模板实算哈希
    # supportedWidgets 必须用引擎 RP/1 的节点名（见 zee-rp scripts/rp_language.py 的 NODE_PROPS），不是 Heron 自己的叫法
    engine-assets: '{"engineCommit":"74f286fead2e2524fb5f710b36e2e1db9e861df5","supportedWidgets":["box","card","row","column","grid","stack","label","paragraph","button","badge","input","divider","image","icon","sparkline","dynamic-panel","repeater","when","data-table","searchable-list","form-card","kv-list","detail-card","wizard-card","master-detail"]}'
  news:
    pipeline-enabled: true
    # 泛资讯源白名单（时政不进）；本机开发与 N3 闭环验收用这两家实测可达的 RSS
    collection-enabled: true
    allowed-hosts:
      - www.ithome.com
      - sspai.com
      - www.ifanr.com
      - www.tmtpost.com
      - m.tmtpost.com
      - www.199it.com
    # 自动产出：按下述三条 cron 各产出一条并自动确认（沙箱发布）
    auto-enabled: false
    auto-slots:
      - "0 0 11 * * ?"
      - "0 0 15 * * ?"
      - "0 0 19 * * ?"
    # 发布出口：douyin-cli 调 social-auto-upload 的 sau（浏览器自动化，不用开放平台凭据）。
    # 首次使用先跑一次登录，cookie 存在仓库的 accounts 目录里：
    #   data/tools/social-auto-upload/.venv/Scripts/sau.exe douyin login --account heron
    publish-adapter: douyin-cli
    publish-command: ${HERON_PUBLISH_COMMAND:./data/tools/social-auto-upload/.venv/Scripts/sau.exe}
    publish-account: heron
    publish-timeout-seconds: 240
